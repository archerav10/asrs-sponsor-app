<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Current Vacancies | Arch Support Residential Services</title>
<link rel="icon" href="/logo.jpg">
<meta name="description" content="Current group home vacancies with Arch Support Residential Services.">
<style>
  :root { --green: #1e4d2b; --ink: #1b1b1b; --muted: #555; --bg: #f4f5f2; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.5rem; text-align: center; margin: 0 0 20px; }
  .vacancy { display: flex; gap: 14px; align-items: center; background: #fff; border-radius: 16px; padding: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); text-decoration: none; color: inherit; margin-bottom: 14px; }
  .vacancy img { width: 88px; height: auto; border-radius: 8px; flex-shrink: 0; }
  .vacancy h2 { margin: 0; font-size: 1.15rem; color: var(--green); }
  .vacancy p { margin: 2px 0 0; color: var(--muted); }
  footer { text-align: center; margin-top: 24px; }
  footer a { color: var(--green); }
</style>
</head>
<body>
<main>
  <h1>Current Vacancies</h1>
  <!-- One card per vacancy; each vacancy lives at /vacancy/<street>/ -->
  <a class="vacancy" href="/vacancy/longstreet">
    <img src="/vacancy/longstreet/flyer.jpg" alt="" width="88" height="114">
    <div>
      <h2>Longstreet</h2>
      <p>Highland Springs Area</p>
    </div>
  </a>
  <footer><a href="/">Arch Support Residential Services</a></footer>
</main>
</body>
</html>
