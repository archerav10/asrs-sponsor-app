<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sponsor Intake · Print</title>
<style>
  /* Printable progress sheet / blank checklist for the binder. Letter
     portrait; the browser's own Print → Save as PDF produces the file. */
  @page {
    size: letter;
    margin: 0.5in 0.5in 0.6in;
    @bottom-left { content: "ASRS Sponsor Intake · Confidential"; font: 7.5pt -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #8a8577; }
    @bottom-right { content: "Page " counter(page) " of " counter(pages); font: 7.5pt -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #8a8577; }
  }
  * { box-sizing: border-box; }
  body { font: 10pt/1.35 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1C1C1A; margin: 0; background: #fff; }
  .toolbar { position: sticky; top: 0; background: #16332B; color: #F6F3EC; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; z-index: 1; }
  .toolbar button { background: #F6F3EC; color: #16332B; border: 0; border-radius: 6px; padding: 7px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .toolbar .msg { opacity: .85; }
  .sheets { max-width: 7.5in; margin: 0 auto; padding: 16px; }
  .sheet + .sheet { break-before: page; margin-top: 40px; }
  @media print { .toolbar { display: none; } .sheets { padding: 0; max-width: none; } .sheet + .sheet { margin-top: 0; } }
  .error { color: #B3261E; padding: 24px 16px; }

  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; border-bottom: 3px solid #16332B; padding-bottom: 8px; margin-bottom: 10px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { height: 46px; width: auto; display: block; }
  .org { font-size: 9pt; letter-spacing: .1em; font-weight: 700; color: #2F5D45; text-transform: uppercase; }
  h1 { font-size: 18pt; margin: 2px 0 0; }
  .meta { display: grid; grid-template-columns: auto auto; gap: 2px 10px; font-size: 9pt; text-align: right; }
  .meta b { color: #5E5B52; font-weight: 600; }
  .summary { display: grid; gap: 4px; margin: 6px 0 4px; }
  .summary div { border: 1px solid #C9C2B0; border-radius: 3px; padding: 4px; font-size: 7.5pt; text-align: center; }
  .summary div.c { background: #DDEEE3; border-color: #1B7A3D; }
  .summary div.cur { background: #F6EBD3; border-color: #9A6B12; font-weight: 700; }
  .summary b { display: block; font-size: 10pt; }
  .legend { font-size: 8pt; color: #5E5B52; margin: 4px 0 12px; }
  .stage { margin-bottom: 10px; }
  h2 { font-size: 11pt; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; break-after: avoid; }
  h2 .sn { background: #16332B; color: #fff; border-radius: 50%; width: 18px; height: 18px; display: inline-grid; place-items: center; font-size: 8.5pt; flex-shrink: 0; }
  h2 .cnt { margin-left: auto; font-size: 8.5pt; font-weight: 400; color: #5E5B52; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { font-size: 7.5pt; text-transform: uppercase; letter-spacing: .05em; color: #5E5B52; text-align: left; border-bottom: 1.5px solid #16332B; padding: 3px 4px; }
  td { border-bottom: 1px solid #D8D2C2; padding: 4px; vertical-align: top; font-size: 9pt; }
  tr { break-inside: avoid; }
  .num { color: #5E5B52; font-variant-numeric: tabular-nums; }
  .who { font-size: 8pt; color: #5E5B52; }
  tr.na td { color: #8a8577; }
  .box { display: inline-block; width: 11px; height: 11px; border: 1.3px solid #1C1C1A; border-radius: 2px; position: relative; top: 1px; }
  .box.on::after { content: ""; position: absolute; left: 3px; top: 0; width: 3px; height: 7px; border: solid #1B7A3D; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .box.na { border-color: #8a8577; }
  .box.na::after { content: ""; position: absolute; left: 2px; right: 2px; top: 4px; border-top: 1.5px solid #8a8577; }
  .L { font-size: 7pt; font-weight: 700; color: #2F5D45; }
  .adm { font-size: 6.5pt; font-weight: 700; color: #6B4FA0; letter-spacing: .04em; margin-left: 3px; }
  .ins { font-size: 8pt; color: #2F5D45; margin-top: 2px; }
  .ret { font-size: 8pt; color: #9A3412; margin-top: 2px; }
  .nar { font-size: 8pt; color: #6B6659; margin-top: 2px; font-style: italic; }
  .meetings { border: 1px solid #C9C2B0; border-radius: 4px; padding: 8px 10px; margin: 0 0 12px; break-inside: avoid; }
  .meetings h3 { font-size: 10pt; margin: 0 0 6px; }
  .mtg { border-top: 1px dashed #D8D2C2; padding: 6px 0; break-inside: avoid; }
  .mtg:first-of-type { border-top: 0; }
  .mh { display: flex; justify-content: space-between; gap: 12px; font-size: 9pt; }
  .mh span { color: #5E5B52; white-space: nowrap; }
  .mtg ul { margin: 3px 0 4px; padding-left: 18px; font-size: 8.5pt; }
  .lines { font-size: 8pt; color: #5E5B52; }
  .lines span { display: block; border-bottom: 1px solid #C9C2B0; height: 14px; }
  .sign { margin-top: 16px; border: 1.5px solid #16332B; border-radius: 4px; padding: 10px 12px; break-inside: avoid; }
  .sign h3 { margin: 0 0 8px; font-size: 10pt; }
  .sg { display: grid; grid-template-columns: 2fr 1fr; gap: 18px 24px; font-size: 8.5pt; color: #5E5B52; }
  .sg div { border-bottom: 1px solid #1C1C1A; height: 26px; display: flex; align-items: flex-end; }
</style>
</head>
<body>
<div class="toolbar"><button type="button" id="print-btn">Print / Save as PDF</button><span class="msg" id="msg">Loading…</span></div>
<div class="sheets" id="sheets"></div>

<script>
(function () {
  const FN_BASE = '/.netlify/functions';
  const SESSION_KEY = 'asrs_admin_dashboard_session';
  const LOGO_URL = '/intake/logo.png';
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode') === 'blank' ? 'blank' : 'progress';
  const WHO = { upload: 'Sponsor', form: 'Sponsor', event: 'Meeting', document: 'ASRS', training: 'Training' };

  document.getElementById('print-btn').addEventListener('click', function () { window.print(); });

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function fmtDate(iso) {
    if (!iso) return '';
    const p = iso.split('-');
    return p[1] + '/' + p[2] + '/' + p[0].slice(2);
  }
  function fmtLongDate(iso) {
    if (!iso) return '';
    return new Date(iso + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function fmtTime(hhmm) {
    if (!hhmm) return '';
    const p = hhmm.split(':').map(Number);
    return new Date(2000, 0, 1, p[0], p[1]).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }
  function initials(name) {
    return (name || '').split(/\s+/).filter(Boolean).map(function (w) { return w[0].toUpperCase(); }).join('').slice(0, 3);
  }

  async function api(path) {
    let stored = null;
    try { stored = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { stored = null; }
    if (!stored) throw new Error('Log in to the admin dashboard first, then use its Print buttons.');
    const res = await fetch(FN_BASE + path, { headers: { Authorization: 'Bearer ' + stored.sessionToken } });
    const data = await res.json();
    if (res.status === 401) throw new Error('Your admin session expired. Log in to the dashboard again, then print.');
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    return data;
  }

  // Status / date / initials for one row. A blank checklist prints every
  // row empty for handwriting.
  function rowState(item) {
    if (mode === 'blank') return { box: '', status: '', date: '', by: '' };
    const by = initials(item.lastUpdatedBy);
    switch (item.status) {
      case 'Complete': return { box: 'on', status: 'Complete', date: fmtDate(item.completedDate), by: by };
      case 'Not Applicable': return { box: 'na', status: 'N/A', date: fmtDate(item.completedDate), by: by };
      case 'Scheduled': return { box: '', status: 'Scheduled', date: fmtDate(item.eventDate) + (item.eventTime ? ' ' + fmtTime(item.eventTime) : ''), by: '' };
      case 'Received': return { box: '', status: 'Received', date: fmtDate(item.receivedDate), by: '' };
      case 'Requested': return { box: '', status: 'Requested', date: fmtDate(item.requestedDate), by: '' };
      case 'Returned': return { box: '', status: 'Returned', date: fmtDate(item.requestedDate), by: '' };
      default: return { box: '', status: '', date: '', by: '' };
    }
  }

  function sheetHtml(data) {
    const intake = data.intake;
    const stages = data.stages;
    const progress = data.progress;
    const items = data.items;
    const stageProgress = {};
    progress.stages.forEach(function (s) { stageProgress[s.num] = s; });
    const current = stages.filter(function (s) { return s.num === progress.currentStage; })[0];
    const today = new Date().toISOString().slice(0, 10);

    let h = '<section class="sheet">';
    h += '<div class="top"><div class="brand"><img src="' + LOGO_URL + '" alt="" onerror="this.remove()"><div>' +
      '<div class="org">ASRS · Sponsor Intake · ' + (mode === 'blank' ? 'Checklist' : 'Progress Sheet') + '</div>' +
      '<h1>' + esc(intake.name) + '</h1></div></div>' +
      '<div class="meta"><b>Started</b><span>' + esc(fmtLongDate(intake.startedDate)) + '</span>' +
      (mode === 'blank' ? '' : '<b>Current stage</b><span>' + (current ? esc(current.position + ' · ' + current.name) : 'Complete') + '</span>') +
      (intake.phone ? '<b>Phone</b><span>' + esc(intake.phone) + '</span>' : '') +
      '<b>Printed</b><span>' + esc(fmtLongDate(today)) + '</span></div></div>';

    if (mode !== 'blank') {
      h += '<div class="summary" style="grid-template-columns:repeat(' + stages.length + ',1fr)">' + stages.map(function (s) {
        const sp = stageProgress[s.num] || { complete: 0, total: 0, isComplete: false };
        const cls = sp.isComplete ? 'c' : (s.num === progress.currentStage ? 'cur' : '');
        return '<div class="' + cls + '"><b>' + sp.complete + '/' + sp.total + '</b>' + esc(s.name) + '</div>';
      }).join('') + '</div>';
    }
    h += '<div class="legend">' + (mode === 'blank'
      ? 'Tick and initial each item as it is completed. '
      : '☑ = complete in the system; ⊟ = not applicable. Blank boxes and the Init. column are for handwritten tracking between updates. ') +
      '<b>[L]</b> = licensing required. <b>ADMIN</b> = ASRS staff only; never shown to the sponsor.</div>';

    stages.forEach(function (stage) {
      const stageItems = items.filter(function (i) { return i.stage === stage.num; });
      if (!stageItems.length) return;
      const sp = stageProgress[stage.num] || { complete: 0, total: stageItems.length };
      h += '<div class="stage"><h2><span class="sn">' + stage.position + '</span>' + esc(stage.name) +
        '<span class="cnt">' + (mode === 'blank' ? stageItems.length + ' items' :
          sp.complete + ' of ' + sp.total + ' complete' + (stage.num === progress.currentStage ? ' · <b>Current stage</b>' : '')) + '</span></h2>' +
        '<table><colgroup><col style="width:22px"><col style="width:40px"><col><col style="width:60px"><col style="width:70px"><col style="width:92px"><col style="width:38px"></colgroup>' +
        '<thead><tr><th></th><th>#</th><th>Item</th><th>Who</th><th>Status</th><th>Date</th><th>Init.</th></tr></thead><tbody>';
      stageItems.forEach(function (item) {
        const st = rowState(item);
        const isNA = mode !== 'blank' && item.status === 'Not Applicable';
        h += '<tr class="' + (isNA ? 'na' : '') + '"><td><span class="box ' + st.box + '"></span></td>' +
          '<td class="num">' + esc(item.key) + '</td><td>' + esc(item.label) +
          (item.licensing ? ' <span class="L">[L]</span>' : '') + (item.adminOnly ? '<span class="adm">ADMIN</span>' : '') +
          (item.instructions ? '<div class="ins">▸ ' + esc(item.instructions) + '</div>' : '') +
          (item.includes && item.includes.length ? '<div class="ins">Includes: ' + esc(item.includes.join('; ')) + '</div>' : '') +
          (mode !== 'blank' && item.status === 'Returned' && item.returnReason ? '<div class="ret">Returned: ' + esc(item.returnReason) + '</div>' : '') +
          (isNA && item.naReason ? '<div class="nar">Not applicable: ' + esc(item.naReason) + '</div>' : '') +
          '</td><td class="who">' + WHO[item.type] + '</td><td>' + esc(st.status) + '</td><td>' + esc(st.date) + '</td><td>' + esc(st.by) + '</td></tr>';
      });
      h += '</tbody></table></div>';

      const meetings = stageItems.filter(function (i) { return i.type === 'event' && !(mode !== 'blank' && i.status === 'Not Applicable'); });
      if (meetings.length) {
        h += '<div class="meetings"><h3>' + esc(stage.name) + ': meetings and agendas</h3>';
        meetings.forEach(function (m) {
          const when = mode !== 'blank' && m.eventDate
            ? fmtLongDate(m.eventDate) + (m.eventTime ? ', ' + fmtTime(m.eventTime) : '')
            : 'Date: ____________  Time: ________';
          h += '<div class="mtg"><div class="mh"><b>' + esc(m.key + ' ' + m.label) + (m.adminOnly ? '<span class="adm">ADMIN</span>' : '') + '</b><span>' + esc(when) + '</span></div>' +
            (m.agenda && m.agenda.length ? '<ul>' + m.agenda.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>' : '') +
            '<div class="lines">Notes: <span></span><span></span></div></div>';
        });
        h += '</div>';
      }
    });

    h += '<div class="sign"><h3>Intake record certification</h3><div class="sg">' +
      '<div>Intake completed by (print name / signature)</div><div>Date</div>' +
      '<div>Reviewed and approved by (print name / signature)</div><div>Date</div>' +
      '<div>Sponsor acknowledgment (signature)</div><div>Date</div></div></div>';
    h += '</section>';
    return h;
  }

  async function run() {
    const msg = document.getElementById('msg');
    const sheets = document.getElementById('sheets');
    try {
      let ids;
      if (params.get('all')) {
        const list = await api('/sponsor-intake-list');
        ids = list.intakes.filter(function (r) { return r.currentStage !== null; }).map(function (r) { return r.id; });
        if (!ids.length) { msg.textContent = 'No active intakes to print.'; return; }
      } else {
        ids = [params.get('id')];
        if (!ids[0]) throw new Error('Open this page from an intake\'s Print button.');
      }
      msg.textContent = 'Loading ' + ids.length + ' intake' + (ids.length === 1 ? '' : 's') + '…';
      const all = await Promise.all(ids.map(function (id) { return api('/sponsor-intake-get?id=' + encodeURIComponent(id)); }));
      sheets.innerHTML = all.map(sheetHtml).join('');
      document.title = (ids.length === 1 ? all[0].intake.name + ' · ' : 'Active intakes · ') + (mode === 'blank' ? 'Intake Checklist' : 'Intake Progress Sheet');
      msg.textContent = ids.length === 1 ? 'Ready to print.' : ids.length + ' intakes, each starting on a new page.';
      setTimeout(function () { window.print(); }, 400);
    } catch (e) {
      msg.textContent = '';
      sheets.innerHTML = '<p class="error">' + esc(e.message) + '</p>';
    }
  }
  run();
})();
</script>
</body>
</html>
