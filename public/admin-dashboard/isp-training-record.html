<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ISP Training Record</title>
<style>
  /* One resident's ISP Training Record: every active staff member at the
     location and the ISP Training Acknowledgment they signed for the
     current plan (data from get-isp-training.js). Letter portrait; the
     browser's Print → Save as PDF produces the file. */
  @page {
    size: letter;
    margin: 0.5in 0.5in 0.6in;
    @bottom-left { content: "ASRS ISP Training Record · Governing policy: 12VAC35-105-450"; font: 7.5pt -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #666; }
    @bottom-right { content: "Page " counter(page) " of " counter(pages); font: 7.5pt -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #666; }
  }
  * { box-sizing: border-box; }
  body { font: 11px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1d2433; margin: 0; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .toolbar { position: sticky; top: 0; background: #1f3a5f; color: #fff; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; z-index: 1; }
  .toolbar button { background: #fff; color: #1f3a5f; border: 0; border-radius: 6px; padding: 7px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .toolbar .msg { opacity: .85; }
  .sheet { max-width: 7.5in; margin: 0 auto; padding: 16px; }
  @media print { .toolbar { display: none; } .sheet { padding: 0; max-width: none; } }
  .error { color: #B3261E; padding: 24px 16px; font-size: 14px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; border-bottom: 2px solid #1f3a5f; padding-bottom: 6px; flex-wrap: wrap; }
  .org { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: #1f3a5f; font-weight: 700; }
  h1 { font-size: 20px; margin: 2px 0; }
  .sub { color: #555; font-size: 12px; }
  .meta { text-align: right; color: #555; }
  .meta b { color: #1d2433; }
  .tiles { display: flex; gap: 8px; margin: 10px 0 4px; flex-wrap: wrap; }
  .tile { flex: 1; min-width: 110px; border: 1px solid #d5dae2; border-left: 5px solid #1f3a5f; border-radius: 4px; padding: 5px 10px; }
  .tile span { display: block; color: #555; }
  .tile b { font-size: 18px; }
  .tile.red { border-left-color: #c62828; } .tile.orange { border-left-color: #ef8a00; } .tile.green { border-left-color: #2e7d32; }
  p.note { color: #444; margin: 8px 0; }
  h2 { font-size: 13px; margin: 14px 0 5px; color: #1f3a5f; }
  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #c9ced6; padding: 4px 6px; text-align: left; vertical-align: top; }
  th { background: #1f3a5f; color: #fff; font-weight: 600; font-size: 10px; }
  tr { break-inside: avoid; }
  td.missing { background: #fdecea; color: #b71c1c; font-weight: 700; }
  td.soon { background: #fff3e0; color: #b25e00; font-weight: 700; }
  td.current { color: #1B5E20; font-weight: 600; }
  .file { font-size: 9.5px; color: #555; overflow-wrap: anywhere; }
  .file a { color: #1f3a5f; }
  .sig { display: flex; gap: 36px; margin-top: 36px; break-inside: avoid; }
  .sig > div { flex: 1; color: #555; }
  .sig > div:last-child { flex: .45; }
  .line { border-bottom: 1px solid #333; height: 26px; margin-bottom: 3px; }
</style>
</head>
<body>
<div class="toolbar"><button type="button" id="print-btn">Print / Save as PDF</button><span class="msg" id="msg">Loading…</span></div>
<div class="sheet" id="sheet"></div>

<script>
(function () {
  const FN_BASE = '/.netlify/functions';
  const SESSION_KEY = 'asrs_admin_dashboard_session';
  const params = new URLSearchParams(location.search);
  const sheet = document.getElementById('sheet');
  const msg = document.getElementById('msg');
  document.getElementById('print-btn').addEventListener('click', function () { window.print(); });

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function fmtDate(iso) {
    if (!iso) return '';
    const p = iso.slice(0, 10).split('-');
    return Number(p[1]) + '/' + Number(p[2]) + '/' + p[0];
  }
  async function api(path) {
    let stored = null;
    try { stored = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { stored = null; }
    if (!stored) throw new Error('Log in to the admin dashboard first, then use its Print ISP Training Record link.');
    const res = await fetch(FN_BASE + path, { headers: { Authorization: 'Bearer ' + stored.sessionToken } });
    const data = await res.json();
    if (res.status === 401) throw new Error('Your admin session expired. Log in to the dashboard again, then print.');
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    return data;
  }
  function fileCell(name, url) {
    if (!name && !url) return '';
    return '<div class="file">' + (url ? '<a href="' + esc(url) + '">' + esc(name || 'Signed acknowledgment') + '</a>' : esc(name)) + '</div>';
  }
  function statusText(state, plan) {
    if (state === 'current') return 'Signed';
    if (state === 'soon') return 'Due by ' + fmtDate(plan.planDate);
    return 'Not signed';
  }

  function render(data) {
    const runDate = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date());
    let html = '<header><div><div class="org">Arch Support Residential Services</div><h1>ISP Training Record</h1>' +
      '<div class="sub">' + esc(data.location) + ' · Resident ' + esc(data.resident) + '</div></div>' +
      '<div class="meta">Run date <b>' + fmtDate(runDate) + '</b></div></header>';

    if (!data.plan) {
      sheet.innerHTML = html + '<p class="note">No Annual Planning cycle (Congregate Residential) is on file for this resident yet.</p>';
      return;
    }
    const plan = data.plan;
    const count = function (st) { return data.staff.filter(function (m) { return m.state === st; }).length; };
    html += '<div class="tiles">' +
      '<div class="tile"><span>Plan (ISP)</span><b>' + fmtDate(plan.planDate) + '</b>' + (plan.revised ? ' <span>revised (effective ' + fmtDate(plan.effectiveDate) + ')</span>' : '') + '</div>' +
      '<div class="tile green"><span>Signed</span><b>' + count('current') + ' of ' + data.staff.length + '</b></div>' +
      '<div class="tile orange"><span>Due before plan date</span><b>' + count('soon') + '</b></div>' +
      '<div class="tile red"><span>Not signed</span><b>' + count('missing') + '</b></div></div>';
    html += '<p class="note">Every active staff member at ' + esc(data.location) + ' is trained on this resident\'s current Individualized Service Plan and signs an ISP Training Acknowledgment (goals and supports, identified risks and risk protocols, behavior support plan, health, medication and dietary needs, communication preferences). ' +
      'Signed acknowledgments are filed in each staff member\'s Training folder in Google Drive.</p>';

    html += '<h2>Current plan: ' + (plan.revised ? 'revised ' : 'effective ') + fmtDate(plan.planDate) + '</h2>' +
      '<div class="wrap"><table><thead><tr><th>Staff</th><th>Role</th><th>Status</th><th>Date signed</th><th>Trained by</th><th>Signed acknowledgment</th></tr></thead><tbody>' +
      (data.staff.length ? data.staff.map(function (m) {
        return '<tr><td><b>' + esc(m.name) + '</b></td><td>' + esc(m.role) + '</td>' +
          '<td class="' + m.state + '">' + statusText(m.state, plan) + '</td>' +
          '<td>' + fmtDate(m.trainedDate) + '</td><td>' + esc(m.trainedBy) + '</td><td>' + fileCell(m.filename, m.fileUrl) + '</td></tr>';
      }).join('') : '<tr><td colspan="6">No active staff on file.</td></tr>') +
      '</tbody></table></div>';

    if ((data.history || []).length) {
      html += '<h2>Earlier plans</h2><div class="wrap"><table><thead><tr><th>Plan date</th><th>Staff</th><th>Date signed</th><th>Trained by</th><th>Signed acknowledgment</th></tr></thead><tbody>' +
        data.history.map(function (r) {
          return '<tr><td>' + fmtDate(r.planDate) + '</td><td>' + esc(r.staffName) + '</td><td>' + fmtDate(r.trainedDate) + '</td><td>' + esc(r.trainedBy) + '</td><td>' + fileCell(r.filename, r.fileUrl) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }

    html += '<div class="sig"><div><div class="line"></div>Reviewed by</div><div><div class="line"></div>Date</div></div>';
    sheet.innerHTML = html;
  }

  const loc = params.get('location');
  const resident = params.get('resident');
  if (!loc || !resident) {
    msg.textContent = '';
    sheet.innerHTML = '<p class="error">Open this from a resident\'s Annual Planning screen.</p>';
    return;
  }
  api('/get-isp-training?location=' + encodeURIComponent(loc) + '&resident=' + encodeURIComponent(resident)).then(function (data) {
    render(data);
    msg.textContent = data.location + ' · ' + data.resident;
    document.title = 'ISP Training Record · ' + data.location + ' ' + data.resident;
  }).catch(function (e) {
    msg.textContent = '';
    sheet.innerHTML = '<p class="error">' + esc(e.message) + '</p>';
  });
})();
</script>
</body>
</html>
