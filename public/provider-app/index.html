<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASRS Provider App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16332B">
<style>
  :root {
    --forest: #16332B;
    --forest-light: #2F5D45;
    --cream: #F6F3EC;
    --ink: #1C1C1A;
    --border: #D8D2C2;
    --error: #B3261E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    background: var(--forest);
    color: var(--cream);
    padding: 20px 24px 18px;
  }
  header .wordmark {
    font-size: 15px;
    letter-spacing: 0.02em;
    opacity: 0.85;
    margin: 0 0 2px;
  }
  header h1 {
    font-size: 22px;
    margin: 0;
    font-weight: 600;
  }
  main {
    max-width: 420px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }
  .screen { display: none; }
  .screen.active { display: block; }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin: 18px 0 6px;
  }
  input[type="email"],
  input[type="password"],
  input[type="tel"],
  input[type="text"] {
    width: 100%;
    padding: 13px 14px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }
  input:focus {
    outline: 2px solid var(--forest-light);
    outline-offset: 1px;
  }
  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: var(--forest);
    color: var(--cream);
    margin-top: 22px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--forest);
    border: 1px solid var(--forest);
    margin-top: 10px;
  }
  .help-text {
    font-size: 13px;
    color: #555;
    margin-top: 6px;
  }
  .error-text {
    font-size: 14px;
    color: var(--error);
    margin-top: 14px;
    display: none;
  }
  .home-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 24px;
    background: #fff;
  }
  .home-card .name { font-size: 18px; font-weight: 600; margin: 0 0 2px; }
  .home-card .meta { font-size: 14px; color: #555; margin: 0; }
  .action-list { display: flex; flex-direction: column; gap: 12px; }
  .action-button {
    text-align: left;
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--border);
    padding: 18px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    margin-top: 0;
  }
  .action-button .sub {
    display: block;
    font-size: 13px;
    font-weight: 400;
    color: #666;
    margin-top: 3px;
  }
  .logout-link {
    display: block;
    text-align: center;
    margin-top: 32px;
    font-size: 14px;
    color: #666;
    background: none;
    border: none;
    text-decoration: underline;
    padding: 6px;
  }
  .screen-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }
  .back-button {
    width: auto;
    background: none;
    color: var(--forest);
    border: none;
    padding: 8px 0;
    margin: 0;
    font-size: 15px;
    font-weight: 600;
  }
  .screen-title {
    font-size: 18px;
    font-weight: 600;
    margin: 14px 0 4px;
  }
  .last-reviewed {
    font-size: 13px;
    color: #555;
    margin: 0 0 18px;
  }
  .item-list { display: flex; flex-direction: column; gap: 10px; }
  .item-row {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    padding: 14px 16px;
  }
  .item-row .item-name { font-weight: 600; font-size: 15px; margin: 0 0 8px; }
  .item-row .item-meta { font-size: 12px; color: #777; margin: 8px 0 0; }
  .item-row label {
    font-size: 12px;
    font-weight: 600;
    margin: 8px 0 4px;
  }
  .item-row input[type="date"],
  .item-row input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .item-save {
    margin-top: 10px;
    padding: 9px;
    font-size: 14px;
  }
  .confirm-bar {
    margin: 26px 0 10px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }
  .loading-text, .empty-text {
    font-size: 14px;
    color: #666;
    padding: 20px 0;
    text-align: center;
  }
  .item-row.checkbox-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
  }
  .item-row.checkbox-row .item-name { margin: 0; }
  .item-row.checkbox-row input[type="checkbox"] {
    width: 26px;
    height: 26px;
    accent-color: var(--forest);
    flex-shrink: 0;
  }
  .item-row.date-row .item-save { margin-top: 12px; }
  .general-notes-wrap {
    margin: 22px 0 0;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }
  .general-notes-wrap label {
    font-size: 14px;
    margin: 0 0 6px;
  }
  .general-notes-wrap textarea {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 6px;
    resize: vertical;
  }
  .fa-status-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin: 4px 0 22px;
    background: #fff;
    font-size: 14px;
    color: #444;
  }
  .item-section-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #777;
    margin: 22px 0 10px;
  }
  .item-section-title:first-child { margin-top: 0; }
  .form-field { margin-bottom: 4px; }
  .form-field label {
    font-size: 14px;
    font-weight: 600;
    margin: 16px 0 6px;
    display: block;
  }
  .form-field input[type="text"],
  .form-field input[type="datetime-local"],
  .form-field input[type="number"],
  .form-field textarea {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
  }
  .form-field textarea { resize: vertical; }
  .evac-time-row { display: flex; gap: 12px; }
  .evac-time-row .evac-field { flex: 1; }
  .evac-time-row label { font-size: 12px; font-weight: 600; margin: 0 0 4px; }
  .success-text {
    font-size: 14px;
    color: var(--forest-light);
    margin: 14px 0 0;
    display: none;
  }
</style>
</head>
<body>

<header>
  <p class="wordmark">Arch Support Residential Services</p>
  <h1>Provider App</h1>
</header>

<main>

  <!-- Screen 1: Email + Password -->
  <section id="screen-login" class="screen active">
    <label for="login-email">Email</label>
    <input type="email" id="login-email" autocomplete="username" inputmode="email">

    <label for="login-password">Password</label>
    <input type="password" id="login-password" autocomplete="current-password">

    <p class="help-text">Use the email and password provided to you by ASRS.</p>
    <p class="error-text" id="login-error"></p>

    <button id="login-submit">Log In</button>
  </section>

  <!-- Screen 2: SMS Code -->
  <section id="screen-otp" class="screen">
    <label for="otp-code">Enter the 6-digit code</label>
    <input type="text" id="otp-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
    <p class="help-text" id="otp-help">We sent a code by text message.</p>
    <p class="error-text" id="otp-error"></p>

    <button id="otp-submit">Verify Code</button>
    <button id="otp-back" class="secondary">Back</button>
  </section>

  <!-- Screen 3: Home -->
  <section id="screen-home" class="screen">
    <div class="home-card">
      <p class="name" id="home-name"></p>
      <p class="meta" id="home-meta"></p>
      <p class="meta" id="home-due-date"></p>
    </div>

    <div class="action-list">
      <button class="action-button" data-action="first-aid">
        First Aid Supplies Report
        <span class="sub">Review or update expiration dates</span>
        <span class="sub" id="home-fa-status"></span>
      </button>
      <button class="action-button" data-action="fire-drill">
        Log Fire Drill
        <span class="sub">Record a completed drill</span>
      </button>
      <button class="action-button" data-action="log-event">
        Log an Event
        <span class="sub">Appointments and community outings</span>
      </button>
    </div>

    <button class="logout-link" id="logout">Log Out</button>
  </section>

  <!-- Screen 4: First Aid Supplies -->
  <section id="screen-first-aid" class="screen">
    <div class="screen-header">
      <button class="back-button" data-back="home">&larr; Back</button>
    </div>
    <p class="screen-title">First Aid Supplies</p>
    <div class="fa-status-card" id="fa-last-reviewed">Loading&hellip;</div>
    <p class="error-text" id="fa-error"></p>

    <div id="fa-list" class="item-list">
      <p class="loading-text">Loading items&hellip;</p>
    </div>

    <div id="fa-general-notes-wrap" class="general-notes-wrap" style="display:none;">
      <label for="fa-general-notes">Notes (optional)</label>
      <textarea id="fa-general-notes" rows="4" placeholder="Anything to flag about this report&hellip;"></textarea>
    </div>

    <div class="confirm-bar">
      <button id="fa-confirm">Confirm Everything Is Correct</button>
    </div>
  </section>

  <!-- Screen 5: Fire Drill Report -->
  <section id="screen-fire-drill" class="screen">
    <div class="screen-header">
      <button class="back-button" data-back="home">&larr; Back</button>
    </div>
    <p class="screen-title">Log Fire Drill</p>
    <p class="error-text" id="fd-error"></p>
    <p class="success-text" id="fd-success">Fire drill logged.</p>

    <div class="form-field">
      <label for="fd-datetime">Date and Time of Drill</label>
      <input type="datetime-local" id="fd-datetime">
    </div>

    <div class="form-field">
      <label for="fd-mock-location">Location of "Mock Fire" in the Home</label>
      <input type="text" id="fd-mock-location" placeholder="e.g. Kitchen">
    </div>

    <div class="form-field">
      <label for="fd-individuals">Individuals Present (Initials)</label>
      <input type="text" id="fd-individuals" placeholder="e.g. JS, MP, AA">
    </div>

    <div class="form-field">
      <label>Total Time to Evacuate</label>
      <div class="evac-time-row">
        <div class="evac-field">
          <label for="fd-evac-min">Minutes</label>
          <input type="number" id="fd-evac-min" min="0" inputmode="numeric" value="0">
        </div>
        <div class="evac-field">
          <label for="fd-evac-sec">Seconds</label>
          <input type="number" id="fd-evac-sec" min="0" max="59" inputmode="numeric" value="0">
        </div>
      </div>
    </div>

    <div class="form-field">
      <label for="fd-notes">Notes (Recommendations/Observations)</label>
      <textarea id="fd-notes" rows="4" placeholder="Optional"></textarea>
    </div>

    <button id="fd-submit">Log Fire Drill</button>
  </section>

</main>

<script>
(function () {
  const FN_BASE = '/.netlify/functions';
  const SESSION_KEY = 'asrs_provider_session';

  const screens = {
    login: document.getElementById('screen-login'),
    otp: document.getElementById('screen-otp'),
    home: document.getElementById('screen-home'),
    firstAid: document.getElementById('screen-first-aid'),
    fireDrill: document.getElementById('screen-fire-drill')
  };

  function getStoredSession() {
    const stored = localStorage.getItem(SESSION_KEY);
    if (!stored) return null;
    try { return JSON.parse(stored); } catch (e) { return null; }
  }

  // Wraps fetch with the session token attached and a shared 401 handler —
  // an expired/invalid session bounces the person back to the login screen
  // instead of showing a broken report screen.
  async function apiFetch(path, options) {
    options = options || {};
    const stored = getStoredSession();
    const headers = Object.assign({}, options.headers || {});
    if (stored) headers['Authorization'] = 'Bearer ' + stored.sessionToken;

    const res = await fetch(FN_BASE + path, Object.assign({}, options, { headers: headers }));

    if (res.status === 401) {
      localStorage.removeItem(SESSION_KEY);
      showScreen('login');
      throw new Error('Your session expired. Please log in again.');
    }

    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || 'Something went wrong.');
    }
    return data;
  }

  function showScreen(name) {
    Object.values(screens).forEach(function (el) { el.classList.remove('active'); });
    screens[name].classList.add('active');
  }

  function setError(id, message) {
    const el = document.getElementById(id);
    el.textContent = message || '';
    el.style.display = message ? 'block' : 'none';
  }

  let pendingOtpToken = null;

  // --- Screen 1: email + password ---
  document.getElementById('login-submit').addEventListener('click', async function () {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    setError('login-error', '');

    if (!email || !password) {
      setError('login-error', 'Enter your email and password.');
      return;
    }

    const btn = this;
    btn.disabled = true;
    try {
      const res = await fetch(FN_BASE + '/provider-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });
      const data = await res.json();
      if (!res.ok) {
        setError('login-error', data.error || 'Something went wrong.');
        return;
      }
      pendingOtpToken = data.otpToken;
      document.getElementById('otp-help').textContent = 'We sent a code to ' + data.maskedPhone + '.';
      document.getElementById('otp-code').value = '';
      showScreen('otp');
    } catch (e) {
      setError('login-error', 'Could not reach the server. Check your connection and try again.');
    } finally {
      btn.disabled = false;
    }
  });

  // --- Screen 2: OTP ---
  document.getElementById('otp-back').addEventListener('click', function () {
    setError('otp-error', '');
    showScreen('login');
  });

  document.getElementById('otp-submit').addEventListener('click', async function () {
    const code = document.getElementById('otp-code').value.trim();
    setError('otp-error', '');

    if (!code) {
      setError('otp-error', 'Enter the code we texted you.');
      return;
    }

    const btn = this;
    btn.disabled = true;
    try {
      const res = await fetch(FN_BASE + '/provider-verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ otpToken: pendingOtpToken, code: code })
      });
      const data = await res.json();
      if (!res.ok) {
        setError('otp-error', data.error || 'Something went wrong.');
        return;
      }
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        sessionToken: data.sessionToken,
        session: data.session
      }));
      renderHome(data.session);
      showScreen('home');
    } catch (e) {
      setError('otp-error', 'Could not reach the server. Check your connection and try again.');
    } finally {
      btn.disabled = false;
    }
  });

  // --- Screen 3: Home ---
  function nextReportDueDate() {
    const now = new Date();
    // Last day of the current month, at local midnight.
    return new Date(now.getFullYear(), now.getMonth() + 1, 0);
  }

  function renderHome(session) {
    document.getElementById('home-name').textContent = session.name || 'Provider';
    const parts = [session.location];
    if (session.residentInitials) parts.push('Resident: ' + session.residentInitials);
    document.getElementById('home-meta').textContent = parts.filter(Boolean).join(' · ');
    document.getElementById('home-due-date').textContent =
      'Next report due: ' + formatDate(nextReportDueDate().toISOString().slice(0, 10));
    loadHomeFirstAidStatus();
  }

  // Fire-and-forget: pulls just enough from First Aid Supplies to show a
  // "Last reviewed" line under its Home button, before the provider taps
  // in. Fails silently — a broken status line shouldn't block Home.
  async function loadHomeFirstAidStatus() {
    const el = document.getElementById('home-fa-status');
    el.textContent = '';
    try {
      const data = await apiFetch('/get-first-aid-supplies');
      const dates = (data.items || []).map(function (i) { return i.lastUpdatedDate; }).filter(Boolean).sort();
      const recent = dates.length ? dates[dates.length - 1] : null;
      el.textContent = 'Last reviewed: ' + (recent ? formatDate(recent) : 'Never');
    } catch (e) {
      // Leave it blank — the report screen itself will surface any real error.
    }
  }

  document.querySelectorAll('.action-button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const action = btn.getAttribute('data-action');
      if (action === 'first-aid') {
        showScreen('firstAid');
        loadFirstAid();
      } else if (action === 'fire-drill') {
        resetFireDrillForm();
        showScreen('fireDrill');
      } else {
        // Log an Event screen lands here in a future build pass.
        alert('This screen is coming next.');
      }
    });
  });

  document.querySelectorAll('[data-back]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      showScreen(btn.getAttribute('data-back'));
    });
  });

  // --- Screen 4: First Aid Supplies ---
  function formatDate(iso) {
    if (!iso) return 'Never';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function mostRecent(items) {
    const dates = items.map(function (i) { return i.lastUpdatedDate; }).filter(Boolean).sort();
    return dates.length ? dates[dates.length - 1] : null;
  }

  // Plain editable date field — no per-row save; the value is read back
  // when Confirm Everything Is Correct is pressed.
  function renderDateRow(item) {
    const wrap = document.createElement('div');
    wrap.className = 'item-row date-row';
    wrap.dataset.itemId = item.id;
    wrap.innerHTML =
      '<p class="item-name">' + item.itemName + '</p>' +
      '<label>Expiration Date</label>' +
      '<input type="date" class="fa-exp-input" value="' + (item.currentExpDate || '') + '">' +
      '<p class="item-meta">Last updated ' + formatDate(item.lastUpdatedDate) + (item.lastUpdatedBy ? ' by ' + item.lastUpdatedBy : '') + '</p>';
    return wrap;
  }

  // Plain checkbox — also no auto-save; read back at Confirm time.
  function renderCheckboxRow(item) {
    const wrap = document.createElement('div');
    wrap.className = 'item-row checkbox-row';
    wrap.dataset.itemId = item.id;
    const checked = item.present === true;
    wrap.innerHTML =
      '<p class="item-name">' + item.itemName + '</p>' +
      '<input type="checkbox" class="fa-present-input"' + (checked ? ' checked' : '') + '>';
    return wrap;
  }

  let currentGeneralNotes = null;

  async function loadFirstAid() {
    const listEl = document.getElementById('fa-list');
    const notesWrap = document.getElementById('fa-general-notes-wrap');
    setError('fa-error', '');
    listEl.innerHTML = '<p class="loading-text">Loading items&hellip;</p>';
    notesWrap.style.display = 'none';

    try {
      const data = await apiFetch('/get-first-aid-supplies');
      const items = data.items || [];
      currentGeneralNotes = data.generalNotes || null;

      const recent = mostRecent(items);
      document.getElementById('fa-last-reviewed').textContent =
        'Last reviewed: ' + (recent ? formatDate(recent) : 'Never');

      listEl.innerHTML = '';
      if (!items.length) {
        listEl.innerHTML = '<p class="empty-text">No active items found for your location.</p>';
        return;
      }

      // Grouped and in order: all date-tracked items first, then the
      // plain checklist items — rather than interleaved alphabetically.
      const dateItems = items.filter(function (i) { return i.tracksExpiration; });
      const checklistItems = items.filter(function (i) { return !i.tracksExpiration; });

      if (dateItems.length) {
        const heading = document.createElement('p');
        heading.className = 'item-section-title';
        heading.textContent = 'Expiration Dates';
        listEl.appendChild(heading);
        dateItems.forEach(function (item) { listEl.appendChild(renderDateRow(item)); });
      }

      if (checklistItems.length) {
        const heading = document.createElement('p');
        heading.className = 'item-section-title';
        heading.textContent = 'Supply Checklist';
        listEl.appendChild(heading);
        checklistItems.forEach(function (item) { listEl.appendChild(renderCheckboxRow(item)); });
      }

      if (currentGeneralNotes) {
        document.getElementById('fa-general-notes').value = currentGeneralNotes.notes || '';
        notesWrap.style.display = 'block';
      }
    } catch (e) {
      listEl.innerHTML = '';
      setError('fa-error', e.message);
    }
  }

  // The single save action: gathers every date field and checkbox
  // currently on screen, plus the notes box, and writes it all at once.
  document.getElementById('fa-confirm').addEventListener('click', async function () {
    const btn = this;
    setError('fa-error', '');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const items = [];
    document.querySelectorAll('#fa-list .date-row').forEach(function (row) {
      items.push({ id: row.dataset.itemId, currentExpDate: row.querySelector('.fa-exp-input').value });
    });
    document.querySelectorAll('#fa-list .checkbox-row').forEach(function (row) {
      items.push({ id: row.dataset.itemId, present: row.querySelector('.fa-present-input').checked });
    });
    const generalNotesValue = currentGeneralNotes ? document.getElementById('fa-general-notes').value : undefined;

    try {
      await apiFetch('/confirm-first-aid-review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: items, generalNotes: generalNotesValue })
      });
      loadFirstAid();
    } catch (e) {
      setError('fa-error', e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Confirm Everything Is Correct';
    }
  });

  // --- Screen 5: Fire Drill Report ---
  function resetFireDrillForm() {
    setError('fd-error', '');
    document.getElementById('fd-success').style.display = 'none';
    document.getElementById('fd-datetime').value = '';
    document.getElementById('fd-mock-location').value = '';
    document.getElementById('fd-individuals').value = '';
    document.getElementById('fd-evac-min').value = '0';
    document.getElementById('fd-evac-sec').value = '0';
    document.getElementById('fd-notes').value = '';
  }

  document.getElementById('fd-submit').addEventListener('click', async function () {
    const btn = this;
    setError('fd-error', '');
    document.getElementById('fd-success').style.display = 'none';

    const drillDateTime = document.getElementById('fd-datetime').value;
    if (!drillDateTime) {
      setError('fd-error', 'Enter the date and time of the drill.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Logging…';
    try {
      await apiFetch('/create-fire-drill-report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          drillDateTime: drillDateTime,
          mockFireLocation: document.getElementById('fd-mock-location').value,
          individualsPresent: document.getElementById('fd-individuals').value,
          evacMinutes: document.getElementById('fd-evac-min').value,
          evacSeconds: document.getElementById('fd-evac-sec').value,
          notes: document.getElementById('fd-notes').value
        })
      });
      resetFireDrillForm();
      document.getElementById('fd-success').style.display = 'block';
    } catch (e) {
      setError('fd-error', e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Log Fire Drill';
    }
  });

  document.getElementById('logout').addEventListener('click', function () {
    localStorage.removeItem(SESSION_KEY);
    document.getElementById('login-email').value = '';
    document.getElementById('login-password').value = '';
    showScreen('login');
  });

  // --- Restore existing session on load ---
  (function init() {
    const stored = localStorage.getItem(SESSION_KEY);
    if (!stored) return;
    try {
      const parsed = JSON.parse(stored);
      renderHome(parsed.session);
      showScreen('home');
    } catch (e) {
      localStorage.removeItem(SESSION_KEY);
    }
  })();
})();
</script>

</body>
</html>
