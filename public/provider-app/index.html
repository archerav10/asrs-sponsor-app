<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASRS Provider App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16332B">
<style>
  :root {
    --forest: #16332B;
    --forest-light: #2F5D45;
    --cream: #F6F3EC;
    --ink: #1C1C1A;
    --border: #D8D2C2;
    --error: #B3261E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    background: var(--forest);
    color: var(--cream);
    padding: 20px 24px 18px;
  }
  header .wordmark {
    font-size: 15px;
    letter-spacing: 0.02em;
    opacity: 0.85;
    margin: 0 0 2px;
  }
  header h1 {
    font-size: 22px;
    margin: 0;
    font-weight: 600;
  }
  main {
    max-width: 420px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }
  .screen { display: none; }
  .screen.active { display: block; }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin: 18px 0 6px;
  }
  input[type="email"],
  input[type="password"],
  input[type="tel"],
  input[type="text"] {
    width: 100%;
    padding: 13px 14px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }
  input:focus {
    outline: 2px solid var(--forest-light);
    outline-offset: 1px;
  }
  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: var(--forest);
    color: var(--cream);
    margin-top: 22px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--forest);
    border: 1px solid var(--forest);
    margin-top: 10px;
  }
  .help-text {
    font-size: 13px;
    color: #555;
    margin-top: 6px;
  }
  .error-text {
    font-size: 14px;
    color: var(--error);
    margin-top: 14px;
    display: none;
  }
  .home-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 24px;
    background: #fff;
  }
  .home-card .name { font-size: 18px; font-weight: 600; margin: 0 0 2px; }
  .home-card .meta { font-size: 14px; color: #555; margin: 0; }
  .action-list { display: flex; flex-direction: column; gap: 12px; }
  .action-button {
    text-align: left;
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--border);
    padding: 18px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    margin-top: 0;
  }
  .action-button .sub {
    display: block;
    font-size: 13px;
    font-weight: 400;
    color: #666;
    margin-top: 3px;
  }
  .logout-link {
    display: block;
    text-align: center;
    margin-top: 32px;
    font-size: 14px;
    color: #666;
    background: none;
    border: none;
    text-decoration: underline;
    padding: 6px;
  }
  .screen-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }
  .back-button {
    width: auto;
    background: none;
    color: var(--forest);
    border: none;
    padding: 8px 0;
    margin: 0;
    font-size: 15px;
    font-weight: 600;
  }
  .screen-title {
    font-size: 18px;
    font-weight: 600;
    margin: 14px 0 4px;
  }
  .last-reviewed {
    font-size: 13px;
    color: #555;
    margin: 0 0 18px;
  }
  .item-list { display: flex; flex-direction: column; gap: 10px; }
  .item-row {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    padding: 14px 16px;
  }
  .item-row .item-name { font-weight: 600; font-size: 15px; margin: 0 0 8px; }
  .item-row .item-meta { font-size: 12px; color: #777; margin: 8px 0 0; }
  .item-row label {
    font-size: 12px;
    font-weight: 600;
    margin: 8px 0 4px;
  }
  .item-row input[type="date"],
  .item-row input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .item-save {
    margin-top: 10px;
    padding: 9px;
    font-size: 14px;
  }
  .confirm-bar {
    margin: 26px 0 10px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }
  .loading-text, .empty-text {
    font-size: 14px;
    color: #666;
    padding: 20px 0;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <p class="wordmark">Arch Support Residential Services</p>
  <h1>Provider App</h1>
</header>

<main>

  <!-- Screen 1: Email + Password -->
  <section id="screen-login" class="screen active">
    <label for="login-email">Email</label>
    <input type="email" id="login-email" autocomplete="username" inputmode="email">

    <label for="login-password">Password</label>
    <input type="password" id="login-password" autocomplete="current-password">

    <p class="help-text">Use the email and password provided to you by ASRS.</p>
    <p class="error-text" id="login-error"></p>

    <button id="login-submit">Log In</button>
  </section>

  <!-- Screen 2: SMS Code -->
  <section id="screen-otp" class="screen">
    <label for="otp-code">Enter the 6-digit code</label>
    <input type="text" id="otp-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
    <p class="help-text" id="otp-help">We sent a code by text message.</p>
    <p class="error-text" id="otp-error"></p>

    <button id="otp-submit">Verify Code</button>
    <button id="otp-back" class="secondary">Back</button>
  </section>

  <!-- Screen 3: Home -->
  <section id="screen-home" class="screen">
    <div class="home-card">
      <p class="name" id="home-name"></p>
      <p class="meta" id="home-meta"></p>
    </div>

    <div class="action-list">
      <button class="action-button" data-action="first-aid">
        First Aid Supplies Report
        <span class="sub">Review or update expiration dates</span>
      </button>
      <button class="action-button" data-action="fire-drill">
        Log Fire Drill
        <span class="sub">Record a completed drill</span>
      </button>
      <button class="action-button" data-action="log-event">
        Log an Event
        <span class="sub">Appointments and community outings</span>
      </button>
    </div>

    <button class="logout-link" id="logout">Log Out</button>
  </section>

  <!-- Screen 4: First Aid Supplies -->
  <section id="screen-first-aid" class="screen">
    <div class="screen-header">
      <button class="back-button" data-back="home">&larr; Back</button>
    </div>
    <p class="screen-title">First Aid Supplies</p>
    <p class="last-reviewed" id="fa-last-reviewed"></p>
    <p class="error-text" id="fa-error"></p>

    <div id="fa-list" class="item-list">
      <p class="loading-text">Loading items&hellip;</p>
    </div>

    <div class="confirm-bar">
      <button id="fa-confirm">Confirm Reviewed Today</button>
    </div>
  </section>

</main>

<script>
(function () {
  const FN_BASE = '/.netlify/functions';
  const SESSION_KEY = 'asrs_provider_session';

  const screens = {
    login: document.getElementById('screen-login'),
    otp: document.getElementById('screen-otp'),
    home: document.getElementById('screen-home'),
    firstAid: document.getElementById('screen-first-aid')
  };

  function getStoredSession() {
    const stored = localStorage.getItem(SESSION_KEY);
    if (!stored) return null;
    try { return JSON.parse(stored); } catch (e) { return null; }
  }

  // Wraps fetch with the session token attached and a shared 401 handler —
  // an expired/invalid session bounces the person back to the login screen
  // instead of showing a broken report screen.
  async function apiFetch(path, options) {
    options = options || {};
    const stored = getStoredSession();
    const headers = Object.assign({}, options.headers || {});
    if (stored) headers['Authorization'] = 'Bearer ' + stored.sessionToken;

    const res = await fetch(FN_BASE + path, Object.assign({}, options, { headers: headers }));

    if (res.status === 401) {
      localStorage.removeItem(SESSION_KEY);
      showScreen('login');
      throw new Error('Your session expired. Please log in again.');
    }

    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || 'Something went wrong.');
    }
    return data;
  }

  function showScreen(name) {
    Object.values(screens).forEach(function (el) { el.classList.remove('active'); });
    screens[name].classList.add('active');
  }

  function setError(id, message) {
    const el = document.getElementById(id);
    el.textContent = message || '';
    el.style.display = message ? 'block' : 'none';
  }

  let pendingOtpToken = null;

  // --- Screen 1: email + password ---
  document.getElementById('login-submit').addEventListener('click', async function () {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    setError('login-error', '');

    if (!email || !password) {
      setError('login-error', 'Enter your email and password.');
      return;
    }

    const btn = this;
    btn.disabled = true;
    try {
      const res = await fetch(FN_BASE + '/provider-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });
      const data = await res.json();
      if (!res.ok) {
        setError('login-error', data.error || 'Something went wrong.');
        return;
      }
      pendingOtpToken = data.otpToken;
      document.getElementById('otp-help').textContent = 'We sent a code to ' + data.maskedPhone + '.';
      document.getElementById('otp-code').value = '';
      showScreen('otp');
    } catch (e) {
      setError('login-error', 'Could not reach the server. Check your connection and try again.');
    } finally {
      btn.disabled = false;
    }
  });

  // --- Screen 2: OTP ---
  document.getElementById('otp-back').addEventListener('click', function () {
    setError('otp-error', '');
    showScreen('login');
  });

  document.getElementById('otp-submit').addEventListener('click', async function () {
    const code = document.getElementById('otp-code').value.trim();
    setError('otp-error', '');

    if (!code) {
      setError('otp-error', 'Enter the code we texted you.');
      return;
    }

    const btn = this;
    btn.disabled = true;
    try {
      const res = await fetch(FN_BASE + '/provider-verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ otpToken: pendingOtpToken, code: code })
      });
      const data = await res.json();
      if (!res.ok) {
        setError('otp-error', data.error || 'Something went wrong.');
        return;
      }
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        sessionToken: data.sessionToken,
        session: data.session
      }));
      renderHome(data.session);
      showScreen('home');
    } catch (e) {
      setError('otp-error', 'Could not reach the server. Check your connection and try again.');
    } finally {
      btn.disabled = false;
    }
  });

  // --- Screen 3: Home ---
  function renderHome(session) {
    document.getElementById('home-name').textContent = session.name || 'Provider';
    const parts = [session.location];
    if (session.residentInitials) parts.push('Resident: ' + session.residentInitials);
    document.getElementById('home-meta').textContent = parts.filter(Boolean).join(' · ');
  }

  document.querySelectorAll('.action-button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const action = btn.getAttribute('data-action');
      if (action === 'first-aid') {
        showScreen('firstAid');
        loadFirstAid();
      } else {
        // Fire Drill and Log an Event screens land here in the next build pass.
        alert('This screen is coming next.');
      }
    });
  });

  document.querySelectorAll('[data-back]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      showScreen(btn.getAttribute('data-back'));
    });
  });

  // --- Screen 4: First Aid Supplies ---
  function formatDate(iso) {
    if (!iso) return 'Never';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function mostRecent(items) {
    const dates = items.map(function (i) { return i.lastUpdatedDate; }).filter(Boolean).sort();
    return dates.length ? dates[dates.length - 1] : null;
  }

  function renderItemRow(item) {
    const wrap = document.createElement('div');
    wrap.className = 'item-row';

    const dateFieldHtml = item.tracksExpiration
      ? '<label>Expiration Date</label><input type="date" class="fa-exp-input" value="' + (item.currentExpDate || '') + '">'
      : '';

    wrap.innerHTML =
      '<p class="item-name">' + item.itemName + '</p>' +
      dateFieldHtml +
      '<label>Notes</label>' +
      '<input type="text" class="fa-notes-input" value="' + (item.notes || '').replace(/"/g, '&quot;') + '" placeholder="Optional">' +
      '<button class="item-save">Save</button>' +
      '<p class="item-meta">Last updated ' + formatDate(item.lastUpdatedDate) + (item.lastUpdatedBy ? ' by ' + item.lastUpdatedBy : '') + '</p>';

    wrap.querySelector('.item-save').addEventListener('click', async function () {
      const expInput = wrap.querySelector('.fa-exp-input');
      const notesInput = wrap.querySelector('.fa-notes-input');
      const saveBtn = this;
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      try {
        await apiFetch('/update-first-aid-item', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            itemId: item.id,
            currentExpDate: expInput ? expInput.value : '',
            notes: notesInput.value
          })
        });
        saveBtn.textContent = 'Saved';
        setTimeout(function () { saveBtn.textContent = 'Save'; saveBtn.disabled = false; }, 1200);
        loadFirstAid(); // refresh "last updated" line and last-reviewed banner
      } catch (e) {
        setError('fa-error', e.message);
        saveBtn.textContent = 'Save';
        saveBtn.disabled = false;
      }
    });

    return wrap;
  }

  async function loadFirstAid() {
    const listEl = document.getElementById('fa-list');
    setError('fa-error', '');
    listEl.innerHTML = '<p class="loading-text">Loading items&hellip;</p>';

    try {
      const data = await apiFetch('/get-first-aid-supplies');
      const items = data.items || [];

      const recent = mostRecent(items);
      document.getElementById('fa-last-reviewed').textContent =
        'Last reviewed: ' + (recent ? formatDate(recent) : 'Never');

      listEl.innerHTML = '';
      if (!items.length) {
        listEl.innerHTML = '<p class="empty-text">No active items found for your location.</p>';
        return;
      }
      items.forEach(function (item) {
        listEl.appendChild(renderItemRow(item));
      });
    } catch (e) {
      listEl.innerHTML = '';
      setError('fa-error', e.message);
    }
  }

  document.getElementById('fa-confirm').addEventListener('click', async function () {
    const btn = this;
    setError('fa-error', '');
    btn.disabled = true;
    btn.textContent = 'Confirming…';
    try {
      await apiFetch('/confirm-first-aid-review', { method: 'POST' });
      loadFirstAid();
    } catch (e) {
      setError('fa-error', e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Confirm Reviewed Today';
    }
  });

  document.getElementById('logout').addEventListener('click', function () {
    localStorage.removeItem(SESSION_KEY);
    document.getElementById('login-email').value = '';
    document.getElementById('login-password').value = '';
    showScreen('login');
  });

  // --- Restore existing session on load ---
  (function init() {
    const stored = localStorage.getItem(SESSION_KEY);
    if (!stored) return;
    try {
      const parsed = JSON.parse(stored);
      renderHome(parsed.session);
      showScreen('home');
    } catch (e) {
      localStorage.removeItem(SESSION_KEY);
    }
  })();
})();
</script>

</body>
</html>
