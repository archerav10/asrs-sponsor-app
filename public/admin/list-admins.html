<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Access & Location Status — ASRS Admin</title>
<style>
  :root { --forest: #16332B; --cream: #F6F3EC; --ink: #1C1C1A; --border: #D8D2C2; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--cream); color: var(--ink); }
  header { background: var(--forest); color: var(--cream); padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 18px; }
  header a { color: var(--cream); font-size: 13px; text-decoration: underline; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 24px 60px; }
  h2 { font-size: 16px; color: var(--forest); margin: 28px 0 10px; }
  .card { border: 1px solid var(--border); border-radius: 8px; background: #fff; padding: 14px 16px; margin-bottom: 10px; }
  .card .name { font-weight: 600; font-size: 15px; margin: 0 0 2px; }
  .card .meta { font-size: 13px; color: #666; margin: 0 0 6px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-right: 4px; margin-bottom: 4px; }
  .badge.on { background: #E4F3E8; color: #1B5E20; }
  .badge.off { background: #F3E4E4; color: #B3261E; }
  .loading { color: #666; font-size: 14px; }
</style>
</head>
<body>
<header><h1>Admin Access &amp; Location Status</h1><a href="/admin/login.html">Admin Tools</a></header>
<main>
  <h2>Admins</h2>
  <div id="admins-list"><p class="loading">Loading&hellip;</p></div>

  <h2>Locations</h2>
  <div id="locations-list"><p class="loading">Loading&hellip;</p></div>
</main>

<script src="/admin/admin-auth.js"></script>
<script>
requireAdminSession();

(async function () {
  const adminsEl = document.getElementById('admins-list');
  const locationsEl = document.getElementById('locations-list');
  try {
    const res = await adminFetch('/.netlify/functions/admin-list-admins');
    const data = await res.json();
    if (!res.ok) {
      adminsEl.innerHTML = '<p>' + (data.error || 'Something went wrong.') + '</p>';
      return;
    }

    adminsEl.innerHTML = '';
    if (!data.admins.length) {
      adminsEl.innerHTML = '<p class="loading">No admins created yet.</p>';
    }
    data.admins.forEach(function (a) {
      const card = document.createElement('div');
      card.className = 'card';
      const locBadges = (a.grantedLocations.length ? a.grantedLocations : ['(none)'])
        .map(function (l) { return '<span class="badge on">' + l + '</span>'; }).join('');
      card.innerHTML =
        '<p class="name">' + a.name + ' <span class="badge ' + (a.enabled ? 'on' : 'off') + '">' + (a.enabled ? 'Enabled' : 'Disabled') + '</span></p>' +
        '<p class="meta">' + a.email + (a.phoneNumber ? ' \u00b7 ' + a.phoneNumber : '') + '</p>' +
        '<div>' + locBadges + '</div>';
      adminsEl.appendChild(card);
    });

    locationsEl.innerHTML = '';
    data.locations.forEach(function (l) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<p class="name">' + l.location + '</p>' +
        '<span class="badge ' + (l.hasPasswordSet ? 'on' : 'off') + '">' + (l.hasPasswordSet ? 'Password set' : 'No password') + '</span>' +
        '<span class="badge ' + (l.active ? 'on' : 'off') + '">' + (l.active ? 'Active' : 'Inactive') + '</span>';
      locationsEl.appendChild(card);
    });
  } catch (e) {
    adminsEl.innerHTML = '<p>Could not load.</p>';
    locationsEl.innerHTML = '';
  }
})();
</script>
</body>
</html>
