<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Medications — ASRS Admin</title>
<style>
  :root { --forest: #16332B; --cream: #F6F3EC; --ink: #1C1C1A; --border: #D8D2C2; --error: #B3261E; --ok: #1B5E20; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--cream); color: var(--ink); }
  header { background: var(--forest); color: var(--cream); padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 18px; }
  header a { color: var(--cream); font-size: 13px; text-decoration: underline; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 24px 60px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
  input, select, textarea { width: 100%; padding: 11px 13px; font-size: 15px; border: 1px solid var(--border); border-radius: 6px; background: #fff; font-family: inherit; }
  button { padding: 11px 16px; font-size: 15px; font-weight: 600; border: none; border-radius: 6px; background: var(--forest); color: var(--cream); cursor: pointer; margin-top: 12px; }
  button.secondary { background: transparent; color: var(--forest); border: 1px solid var(--forest); }
  button:disabled { opacity: 0.55; }
  .lookup-row { display: flex; gap: 10px; align-items: flex-end; }
  .lookup-row > div { flex: 1; }
  .lookup-row button { flex-shrink: 0; }
  h2 { font-size: 16px; color: var(--forest); margin: 28px 0 10px; }
  .med-card { border: 1px solid var(--border); border-radius: 8px; background: #fff; padding: 14px 16px; margin-bottom: 12px; }
  .med-card.inactive { opacity: 0.55; }
  .field-row { display: flex; gap: 10px; }
  .field-row > div { flex: 1; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .checkbox-row input { width: 20px; height: 20px; accent-color: var(--forest); }
  .msg { font-size: 14px; margin-top: 8px; display: none; }
  .msg.error { color: var(--error); }
  .msg.ok { color: var(--ok); }
  .empty { color: #666; font-size: 14px; }
</style>
</head>
<body>
<header><h1>Manage Medications</h1><a href="/admin/login.html">Admin Tools</a></header>
<main>
  <div class="lookup-row">
    <div>
      <label for="location">Location</label>
      <select id="location">
        <option value="Longstreet">Longstreet</option>
        <option value="Mylan">Mylan</option>
        <option value="Reigel">Reigel</option>
        <option value="Janeway" selected>Janeway</option>
        <option value="BlossomView">BlossomView</option>
        <option value="Philray">Philray</option>
      </select>
    </div>
    <div>
      <label for="resident">Resident Initials</label>
      <input type="text" id="resident" placeholder="e.g. AR">
    </div>
    <button id="lookup-btn">Look Up</button>
  </div>

  <h2>Existing Medications</h2>
  <div id="med-list"><p class="empty">Look up a resident to see their medications.</p></div>

  <h2>Add a New Medication</h2>
  <div class="med-card" id="new-med-card">
    <label>Drug Name</label>
    <input type="text" id="new-name">
    <div class="field-row">
      <div><label>Dosage</label><input type="text" id="new-dosage"></div>
      <div><label>Frequency</label><input type="text" id="new-frequency"></div>
    </div>
    <label>Purpose</label>
    <input type="text" id="new-purpose">
    <label>Type</label>
    <select id="new-type">
      <option value="Regular">Regular</option>
      <option value="PRN">PRN</option>
    </select>
    <button id="add-btn">Add Medication</button>
    <p class="msg" id="add-msg"></p>
  </div>
</main>

<script src="/admin/admin-auth.js"></script>
<script>
requireAdminSession();

function medCardHtml(med) {
  return '' +
    '<label>Drug Name</label>' +
    '<input type="text" class="f-name" value="' + (med.itemName || '').replace(/"/g, '&quot;') + '">' +
    '<div class="field-row">' +
      '<div><label>Dosage</label><input type="text" class="f-dosage" value="' + (med.dosage || '').replace(/"/g, '&quot;') + '"></div>' +
      '<div><label>Frequency</label><input type="text" class="f-frequency" value="' + (med.frequency || '').replace(/"/g, '&quot;') + '"></div>' +
    '</div>' +
    '<label>Purpose</label>' +
    '<input type="text" class="f-purpose" value="' + (med.purpose || '').replace(/"/g, '&quot;') + '">' +
    '<label>Type</label>' +
    '<select class="f-type">' +
      '<option value="Regular"' + (med.medicationType === 'Regular' ? ' selected' : '') + '>Regular</option>' +
      '<option value="PRN"' + (med.medicationType === 'PRN' ? ' selected' : '') + '>PRN</option>' +
    '</select>' +
    '<div class="checkbox-row"><input type="checkbox" class="f-active"' + (med.active ? ' checked' : '') + '><label style="margin:0;">Active</label></div>' +
    '<button class="save-btn">Save</button>' +
    '<p class="msg"></p>';
}

function attachSaveHandler(card, med, location, resident) {
  card.querySelector('.save-btn').addEventListener('click', async function () {
    const btn = this;
    const msg = card.querySelector('.msg');
    msg.className = 'msg';
    msg.style.display = 'none';
    btn.disabled = true;
    try {
      const res = await adminFetch('/.netlify/functions/admin-save-medication', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: med.id,
          location: location,
          resident: resident,
          itemName: card.querySelector('.f-name').value.trim(),
          dosage: card.querySelector('.f-dosage').value,
          frequency: card.querySelector('.f-frequency').value,
          purpose: card.querySelector('.f-purpose').value,
          medicationType: card.querySelector('.f-type').value,
          active: card.querySelector('.f-active').checked
        })
      });
      const data = await res.json();
      msg.style.display = 'block';
      if (!res.ok) {
        msg.classList.add('error');
        msg.textContent = data.error || 'Something went wrong.';
      } else {
        msg.classList.add('ok');
        msg.textContent = 'Saved.';
        card.classList.toggle('inactive', !card.querySelector('.f-active').checked);
      }
    } catch (e) {
      msg.style.display = 'block';
      msg.classList.add('error');
      msg.textContent = 'Could not reach the server.';
    } finally {
      btn.disabled = false;
    }
  });
}

document.getElementById('lookup-btn').addEventListener('click', async function () {
  const location = document.getElementById('location').value;
  const resident = document.getElementById('resident').value.trim();
  const listEl = document.getElementById('med-list');
  if (!resident) { listEl.innerHTML = '<p class="empty">Enter resident initials first.</p>'; return; }

  listEl.innerHTML = '<p class="empty">Loading&hellip;</p>';
  try {
    const res = await adminFetch('/.netlify/functions/admin-list-medications?location=' + encodeURIComponent(location) + '&resident=' + encodeURIComponent(resident));
    const data = await res.json();
    if (!res.ok) { listEl.innerHTML = '<p class="empty">' + (data.error || 'Something went wrong.') + '</p>'; return; }

    listEl.innerHTML = '';
    if (!data.medications.length) {
      listEl.innerHTML = '<p class="empty">No medications found for ' + resident + ' at ' + location + '.</p>';
      return;
    }
    data.medications.forEach(function (med) {
      const card = document.createElement('div');
      card.className = 'med-card' + (med.active ? '' : ' inactive');
      card.innerHTML = medCardHtml(med);
      listEl.appendChild(card);
      attachSaveHandler(card, med, location, resident);
    });
  } catch (e) {
    listEl.innerHTML = '<p class="empty">Could not reach the server.</p>';
  }
});

document.getElementById('add-btn').addEventListener('click', async function () {
  const location = document.getElementById('location').value;
  const resident = document.getElementById('resident').value.trim();
  const msg = document.getElementById('add-msg');
  msg.className = 'msg';
  msg.style.display = 'none';

  if (!resident) {
    msg.style.display = 'block';
    msg.classList.add('error');
    msg.textContent = 'Enter resident initials at the top first.';
    return;
  }

  const btn = this;
  btn.disabled = true;
  try {
    const res = await adminFetch('/.netlify/functions/admin-save-medication', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        location: location,
        resident: resident,
        itemName: document.getElementById('new-name').value.trim(),
        dosage: document.getElementById('new-dosage').value,
        frequency: document.getElementById('new-frequency').value,
        purpose: document.getElementById('new-purpose').value,
        medicationType: document.getElementById('new-type').value,
        active: true
      })
    });
    const data = await res.json();
    msg.style.display = 'block';
    if (!res.ok) {
      msg.classList.add('error');
      msg.textContent = data.error || 'Something went wrong.';
    } else {
      msg.classList.add('ok');
      msg.textContent = 'Added. Look up ' + resident + ' again to see it in the list above.';
      document.getElementById('new-name').value = '';
      document.getElementById('new-dosage').value = '';
      document.getElementById('new-frequency').value = '';
      document.getElementById('new-purpose').value = '';
    }
  } catch (e) {
    msg.style.display = 'block';
    msg.classList.add('error');
    msg.textContent = 'Could not reach the server.';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
