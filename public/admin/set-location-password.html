<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set Location Password — ASRS Admin</title>
<style>
  :root { --forest: #16332B; --cream: #F6F3EC; --ink: #1C1C1A; --border: #D8D2C2; --error: #B3261E; --ok: #1B5E20; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--cream); color: var(--ink); }
  header { background: var(--forest); color: var(--cream); padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 18px; }
  header a { color: var(--cream); font-size: 13px; text-decoration: underline; }
  main { max-width: 460px; margin: 0 auto; padding: 28px 24px 60px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
  input, select { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  button { width: 100%; padding: 13px; font-size: 16px; font-weight: 600; border: none; border-radius: 6px; background: var(--forest); color: var(--cream); margin-top: 20px; cursor: pointer; }
  button:disabled { opacity: 0.55; }
  .msg { font-size: 14px; margin-top: 14px; display: none; }
  .msg.error { color: var(--error); }
  .msg.ok { color: var(--ok); }
  .help { font-size: 13px; color: #555; margin-top: 4px; }
</style>
</head>
<body>
<header><h1>Set Location Password</h1><a href="/admin/login.html">Admin Tools</a></header>
<main>
  <label for="location">Location</label>
  <select id="location">
    <option value="Longstreet">Longstreet</option>
    <option value="Mylan">Mylan</option>
    <option value="Reigel">Reigel</option>
    <option value="Janeway">Janeway</option>
    <option value="BlossomView">BlossomView</option>
    <option value="Philray">Philray</option>
  </select>

  <label for="new-password">New password (min 8 characters)</label>
  <input type="text" id="new-password">
  <p class="help">This is a shared password — anyone granted access to this location will use the same one.</p>

  <button id="submit">Set Password</button>
  <p class="msg" id="msg"></p>
</main>

<script src="/admin/admin-auth.js"></script>
<script>
requireAdminSession();

document.getElementById('submit').addEventListener('click', async function () {
  const location = document.getElementById('location').value;
  const newPassword = document.getElementById('new-password').value;
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  msg.style.display = 'none';

  const btn = this;
  btn.disabled = true;
  try {
    const res = await adminFetch('/.netlify/functions/admin-set-location-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ location, newPassword })
    });
    const data = await res.json();
    msg.style.display = 'block';
    if (!res.ok) {
      msg.classList.add('error');
      msg.textContent = data.error || 'Something went wrong.';
    } else {
      msg.classList.add('ok');
      msg.textContent = 'Password set for ' + location + '.';
      document.getElementById('new-password').value = '';
    }
  } catch (e) {
    msg.style.display = 'block';
    msg.classList.add('error');
    msg.textContent = 'Could not reach the server.';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
