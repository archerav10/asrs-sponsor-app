[build]
  functions = "netlify/functions"
  publish = "public"

[[redirects]]
  from = "/"
  to = "/provider-app/"
  status = 302

[functions."check-report-status"]
  # 9:30am US/Eastern. Netlify cron runs in UTC with no DST awareness,
  # so this is pinned to EDT (UTC-4); during EST (Nov-Mar) it'll fire at
  # 8:30am local instead of 9:30 — still comfortably non-disruptive,
  # just a heads-up rather than a bug.
  schedule = "30 13 * * *"

[functions."check-mar-medication-alerts"]
  schedule = "30 13 * * *"

[functions."check-admin-digest"]
  # 8:00am US/Eastern every Friday. Pinned to EDT (UTC-4) like the
  # others — during EST (Nov-Mar) this fires at 7:00am local instead.
  schedule = "0 12 * * 5"
